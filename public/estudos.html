<html lang="pt-BR"><head>
<meta charset="UTF-8">
<title>Estudos — LifePlan</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>
  // aplica o tema salvo antes da primeira pintura (sem piscar)
  (function(){
    try{
      if(localStorage.getItem('lifeplan_theme') === 'dark'){
        document.documentElement.setAttribute('data-theme','dark');
      }
    }catch(e){}
  })();
</script>
<link rel="stylesheet" href="/lifeplan-theme.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); min-height:100vh; color:var(--text); font-family:var(--font-body); font-size:15px; line-height:1.45; transition:background-color .2s, color .2s; }

  header { background:var(--surface); border-bottom:1px solid var(--border); padding:0.75rem 1rem 0; }
  .head-row { display:flex; align-items:center; gap:0.5rem; flex-wrap:wrap; max-width:960px; margin:0 auto; }
  header h1 { font-family:var(--font-display); font-weight:500; font-size:1.6rem; letter-spacing:-0.01em; margin-right:auto; }
  #cloudStatus { font-size:0.8rem; color:var(--muted); white-space:nowrap; }
  .icon-btn { width:44px; height:44px; display:inline-flex; align-items:center; justify-content:center; background:transparent; border:0; border-radius:12px; color:var(--accent); cursor:pointer; padding:0; }
  .icon-btn:hover { background:var(--accent-soft); }
  nav { display:flex; gap:0.25rem; overflow-x:auto; max-width:960px; margin:0.25rem auto 0; scrollbar-width:none; }
  nav::-webkit-scrollbar { display:none; }
  nav button { background:transparent; color:var(--muted); border:0; border-bottom:3px solid transparent; min-height:48px; padding:0 1rem; font:inherit; font-weight:500; cursor:pointer; white-space:nowrap; }
  nav button:hover { color:var(--text); }
  nav button.active { color:var(--text); font-weight:700; border-bottom-color:var(--accent); }

  main { padding:1.25rem 1rem 1.75rem; max-width:960px; margin:0 auto; }
  .tab { display:none; animation:fadeIn 0.25s; }
  .tab.active { display:block; }
  @keyframes fadeIn { from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
  h2 { font-family:var(--font-display); font-weight:500; font-size:1.5rem; color:var(--text); margin-bottom:1rem; letter-spacing:-0.01em; }
  h3 { font-family:var(--font-display); font-weight:500; font-size:1.2rem; color:var(--text); margin:1.5rem 0 0.6rem; }

  .form-row { display:flex; flex-wrap:wrap; gap:0.5rem; margin-bottom:1rem; }
  .form-row > * { flex:1 1 150px; }
  input, select, textarea, button { font-family:inherit; font-size:0.95rem; border-radius:12px; }
  input, select, textarea { min-height:44px; padding:0.6rem 0.75rem; background:var(--surface); color:var(--text); border:1px solid var(--border); }
  input::placeholder { color:var(--muted); opacity:1; }
  input:focus, select:focus, textarea:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-soft); }
  .btn { min-height:44px; padding:0.55rem 1rem; background:var(--accent); color:var(--on-accent); border:none; cursor:pointer; font-weight:700; }
  .btn:hover { filter:brightness(1.08); }
  .btn-danger { background:var(--danger); }
  .btn-sm { min-height:36px; padding:0.3rem 0.7rem; }
  .btn-ghost { background:transparent; color:var(--accent); border:1.5px solid var(--accent); }

  .card { background:var(--surface); border:1px solid var(--border); padding:1rem 1.1rem; border-radius:var(--radius); margin-bottom:0.75rem; }
  .card.aprovado { background:var(--success-soft); border-color:var(--success); }
  .card.reprovado { background:var(--warning-soft); border-color:var(--warning); }
  .card-header { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:0.5rem; }
  .status { display:inline-flex; align-items:center; gap:0.35rem; font-weight:600; }
  .status svg { flex-shrink:0; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:0.75rem; margin:0 0 1rem; }
  .stat { background:var(--accent-soft); color:var(--accent-dark); padding:1rem; border-radius:var(--radius); }
  .stat h4 { font-size:0.85rem; font-weight:600; }
  .stat p { font-family:var(--font-display); font-size:2rem; font-weight:500; margin-top:0.2rem; font-variant-numeric:tabular-nums; }
  .table-wrap { overflow-x:auto; border:1px solid var(--border); border-radius:var(--radius); background:var(--surface); margin-top:0.75rem; }
  table { width:100%; border-collapse:collapse; }
  th, td { padding:0.7rem 0.8rem; text-align:left; border-bottom:1px solid var(--border2); font-variant-numeric:tabular-nums; }
  th { background:var(--surface2); color:var(--text-2); font-size:0.8rem; font-weight:700; letter-spacing:0.04em; text-transform:uppercase; white-space:nowrap; }
  tr:last-child td { border-bottom:none; }
  tr:hover td { background:var(--row-hover); }
  .progress { background:var(--track); height:20px; border-radius:10px; overflow:hidden; margin-top:0.3rem; }
  .progress-bar { height:100%; min-width:2.6rem; background:var(--accent-fill); display:flex; align-items:center; justify-content:center; color:var(--on-accent); font-size:0.8rem; font-weight:700; transition:width 0.5s; font-variant-numeric:tabular-nums; }
  .calendar { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:4px; margin-top:1rem; }
  .day-name { background:var(--surface2); color:var(--text-2); padding:0.4rem 0; text-align:center; font-weight:700; font-size:0.8rem; border-radius:8px; }
  .day { background:var(--surface); padding:0.35rem; min-height:76px; border-radius:10px; border:1.5px solid var(--border); color:var(--text); overflow:hidden; }
  .day.has-event { background:var(--warning-soft); border-color:var(--warning); }
  .day.today { background:var(--accent-soft); border-color:var(--accent); font-weight:700; }
  .day .num { font-weight:700; font-variant-numeric:tabular-nums; }
  .calendar-header { display:flex; justify-content:space-between; align-items:center; gap:0.5rem; margin-bottom:0.5rem; }
  .calendar-header h3 { margin:0; text-align:center; }
  .badge { display:inline-block; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; padding:0.1rem 0.5rem; border-radius:12px; font-size:0.75rem; font-weight:700; color:var(--on-accent); }
  .badge.prova { background:var(--danger); }
  .badge.trabalho { background:var(--warning); }
  .badge.outro { background:var(--info); }
  .empty { text-align:center; color:var(--muted); padding:1.5rem 1rem; }
  small { color:var(--muted); font-size:0.85rem; }

  @media (max-width:520px) {
    .day { min-height:56px; padding:0.2rem; }
    .day .badge { font-size:0.62rem; padding:0 0.3rem; }
    .btn-label { display:none; }
  }

  /* ── Relatório em PDF (impressão) — mantém cores fixas, é papel ───────── */
  #pdf-report { padding: 24px; color: #1a1a1a; background: #fff; font-family: 'Segoe UI', sans-serif; }
  #pdf-report h1 { font-size: 22px; margin-bottom: 2px; font-family: inherit; }
  #pdf-report .pdf-subtitle { font-size: 12px; color: #666; margin-bottom: 20px; }
  #pdf-report h2 { font-size: 16px; margin: 22px 0 8px; padding-bottom: 4px; border-bottom: 2px solid #333; color:#1a1a1a; font-family: inherit; }
  #pdf-report h3 { font-size: 13px; margin: 14px 0 6px; color: #333; font-family: inherit; }
  #pdf-report table { width: 100%; border-collapse: collapse; margin-bottom: 10px; font-size: 11px; }
  #pdf-report th, #pdf-report td { border: 1px solid #ccc; padding: 5px 7px; text-align: left; }
  #pdf-report th { background: #eee; color:#1a1a1a; text-transform:none; letter-spacing:0; }
  #pdf-report .pdf-ok { color: #1e7e34; font-weight: bold; }
  #pdf-report .pdf-bad { color: #b03a2e; font-weight: bold; }
  #pdf-report .pdf-empty { font-size: 11px; color: #888; font-style: italic; margin-bottom: 10px; }
  @media print {
    body * { visibility: hidden; }
    #pdf-report, #pdf-report * { visibility: visible; }
    #pdf-report { display: block !important; position: absolute; top: 0; left: 0; width: 100%; padding: 10px 20px; }
  }
</style>
</head>
<body>
<div id="pdf-report" style="display:none"></div>
<header>
  <div class="head-row">
    <h1>Estudos</h1>
    <span id="cloudStatus"></span>
    <button class="icon-btn" onclick="openSearchPanel()" title="Buscar em matérias, notas, estudos e eventos" aria-label="Buscar">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
    </button>
    <button class="icon-btn" onclick="exportStudyReportPDF()" title="Baixar um PDF com matérias, notas, estudos e eventos" aria-label="Exportar PDF">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" x2="12" y1="15" y2="3"></line></svg>
    </button>
  </div>
  <nav role="tablist" aria-label="Seções de estudos">
    <button class="tab-btn active" data-tab="dashboard" role="tab" aria-selected="true">Painel</button>
    <button class="tab-btn" data-tab="materias" role="tab" aria-selected="false">Matérias</button>
    <button class="tab-btn" data-tab="estudos" role="tab" aria-selected="false">Estudos</button>
    <button class="tab-btn" data-tab="notas" role="tab" aria-selected="false">Notas</button>
    <button class="tab-btn" data-tab="calendario" role="tab" aria-selected="false">Calendário</button>
  </nav>
</header>

<div id="search-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:2000;align-items:flex-start;justify-content:center;padding-top:60px" onclick="if(event.target===this)closeSearchPanel()">
  <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);width:92%;max-width:640px;max-height:78vh;display:flex;flex-direction:column;box-shadow:var(--shadow-md)">
    <div style="display:flex;align-items:center;gap:8px;padding:8px 8px 8px 16px;border-bottom:1px solid var(--border)">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
      <input id="search-input" type="text" aria-label="Buscar" placeholder="Buscar por matéria, avaliação, tópico ou evento..." oninput="performSearch(this.value)" style="flex:1;background:transparent;border:none;outline:none;box-shadow:none;font-size:15px;color:var(--text)">
      <button class="icon-btn" onclick="closeSearchPanel()" aria-label="Fechar busca">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
      </button>
    </div>
    <div id="search-results" style="overflow-y:auto;padding:8px 0"></div>
  </div>
</div>

<main>
  <!-- PAINEL -->
  <section id="dashboard" class="tab active">
    <div class="grid" id="stats-grid"></div>
    <h3>Horas estudadas por matéria</h3>
    <div id="hours-by-subject"></div>
    <h3>Situação nas matérias</h3>
    <div id="situation-list"></div>
    <h3>Próximos eventos</h3>
    <div id="upcoming-events"></div>
  </section>

  <!-- MATÉRIAS -->
  <section id="materias" class="tab">
    <h2>Minhas matérias</h2>
    <div class="form-row">
      <input type="text" id="subj-name" aria-label="Nome da matéria" placeholder="Nome da matéria (ex: Matemática)">
      <input type="number" id="subj-pass" aria-label="Nota mínima" placeholder="Nota mínima p/ passar (ex: 7)" step="0.1" min="0">
      <input type="number" id="subj-max" aria-label="Nota máxima" placeholder="Nota máxima (ex: 10)" step="0.1" min="0">
      <input type="number" id="subj-stages" aria-label="Quantidade de avaliações" placeholder="Quantas avaliações/etapas?" step="1" min="1">
      <button class="btn" onclick="addSubject()">+ Adicionar matéria</button>
    </div>
    <div id="subjects-list"></div>
  </section>

  <!-- ESTUDOS -->
  <section id="estudos" class="tab">
    <h2>Registro de estudos</h2>
    <div class="form-row">
      <select id="study-subject" aria-label="Matéria"></select>
      <input type="date" id="study-date" aria-label="Data">
      <input type="number" id="study-hours" aria-label="Horas estudadas" placeholder="Horas estudadas" step="0.25" min="0">
      <input type="text" id="study-topic" aria-label="O que estudou" placeholder="O que estudou?">
      <button class="btn" onclick="addStudy()">+ Registrar</button>
    </div>
    <div id="studies-list"></div>
  </section>

  <!-- NOTAS -->
  <section id="notas" class="tab">
    <h2>Notas e aprovação</h2>
    <div class="form-row">
      <select id="grade-subject" aria-label="Matéria"></select>
      <input type="text" id="grade-name" aria-label="Nome da avaliação" placeholder="Nome da avaliação (ex: Prova 1)">
      <input type="number" id="grade-value" aria-label="Nota obtida" placeholder="Nota obtida" step="0.1" min="0">
      <input type="number" id="grade-weight" aria-label="Peso" placeholder="Peso" step="0.1" min="0">
      <button class="btn" onclick="addGrade()">+ Adicionar nota</button>
    </div>
    <div id="grades-list"></div>
  </section>

  <!-- CALENDÁRIO -->
  <section id="calendario" class="tab">
    <h2>Calendário de provas e trabalhos</h2>
    <div class="form-row">
      <input type="text" id="ev-title" aria-label="Título do evento" placeholder="Título do evento">
      <select id="ev-type" aria-label="Tipo">
        <option value="prova">Prova</option>
        <option value="trabalho">Trabalho</option>
        <option value="outro">Outro</option>
      </select>
      <select id="ev-subject" aria-label="Matéria"></select>
      <input type="date" id="ev-date" aria-label="Data">
      <input type="text" id="ev-desc" aria-label="Descrição" placeholder="Descrição (opcional)">
      <button class="btn" onclick="addEvent()">+ Adicionar evento</button>
    </div>
    <div class="calendar-header">
      <button class="btn btn-ghost" onclick="changeMonth(-1)" aria-label="Mês anterior">&larr; <span class="btn-label">Anterior</span></button>
      <h3 id="cal-title"></h3>
      <button class="btn btn-ghost" onclick="changeMonth(1)" aria-label="Próximo mês"><span class="btn-label">Próximo</span> &rarr;</button>
    </div>
    <div class="calendar" id="calendar"></div>
    <h3>Lista de eventos</h3>
    <div id="events-list"></div>
    <h3>Eventos da Google Agenda</h3>
    <div id="google-events-list"><p class="empty">Conecte a Google Agenda na tela Início do LifePlan para ver seus eventos aqui.</p></div>
  </section>
</main>

<script>
// ===== Segurança: escapa todo texto digitado pelo usuário antes de ir para innerHTML =====
function esc(v) {
  return String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}
const EV_TYPES = ['prova','trabalho','outro'];
function safeType(t) { return EV_TYPES.includes(t) ? t : 'outro'; }
const ICON_CHECK = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>';
const ICON_ALERT = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M12 8v4"></path><path d="M12 16h.01"></path></svg>';

// ===== Nuvem (Supabase) — mesma sessão/projeto do app principal =====
// Recebe a URL/chave do LifePlan via query string para compartilhar a
// sessão de login já feita (não pede login de novo aqui) e sincronizar
// os dados desta aba (matérias, notas, provas, horas de estudo, eventos)
// na tabela "study_data", uma linha por usuário.
const __params = new URLSearchParams(window.location.search);
const SUPABASE_URL = __params.get('sbUrl') || '';
const SUPABASE_KEY = __params.get('sbKey') || '';
let supa = null, currentUser = null, cloudReady = false;
if (SUPABASE_URL && SUPABASE_KEY && window.supabase) {
  supa = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: true, autoRefreshToken: true } });
}
function setCloudStatus(text) {
  const el = document.getElementById('cloudStatus');
  if (el) el.textContent = text;
}

// ===== Estado =====
let data = JSON.parse(localStorage.getItem('studyApp')) || {
  subjects: [], studies: [], grades: [], events: []
};
let currentDate = new Date();

const uid = () => Date.now() + Math.random().toString(36).slice(2,7);

// ── MODO ESCURO ────────────────────────────────────────────────────────────
// Não tem botão aqui dentro — o único botão do app fica no LifePlan (fora do
// iframe) e avisa esta página via postMessage quando muda.
window.addEventListener('message', (e) => {
  if (e.origin !== window.location.origin) return;
  if (!e.data || !e.data.lifeplanTheme) return;
  if (e.data.lifeplanTheme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  else document.documentElement.removeAttribute('data-theme');
});

let __saveTimer = null;
function save() {
  localStorage.setItem('studyApp', JSON.stringify(data)); // cache local instantâneo
  if (!supa || !currentUser) return;
  setCloudStatus('Salvando...');
  clearTimeout(__saveTimer);
  __saveTimer = setTimeout(syncToCloud, 600);
}
async function syncToCloud() {
  if (!supa || !currentUser) return;
  try {
    const { error } = await supa.from('study_data').upsert({
      user_id: currentUser.id, data, updated_at: new Date().toISOString()
    });
    if (error) throw error;
    setCloudStatus('Salvo na nuvem');
  } catch (e) {
    console.error(e);
    setCloudStatus('Erro ao salvar na nuvem');
  }
}
async function loadFromCloud() {
  if (!supa) return;
  try {
    const { data: { session } } = await supa.auth.getSession();
    if (!session?.user) return;
    currentUser = session.user;
    setCloudStatus('Carregando...');
    const { data: row } = await supa.from('study_data').select('data').eq('user_id', currentUser.id).maybeSingle();
    if (row?.data) {
      data = row.data;
      localStorage.setItem('studyApp', JSON.stringify(data));
    }
    setCloudStatus('Sincronizado');
    cloudReady = true;
    renderAll();
  } catch (e) {
    console.error(e);
    setCloudStatus('Modo offline (só neste navegador)');
  }
}
loadFromCloud();

// ===== Navegação =====
function goToTab(tabName) {
  document.querySelectorAll('.tab-btn').forEach(b=>{ b.classList.remove('active'); b.setAttribute('aria-selected','false'); });
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  const btn = document.querySelector(`.tab-btn[data-tab="${tabName}"]`);
  if (btn) { btn.classList.add('active'); btn.setAttribute('aria-selected','true'); }
  const panel = document.getElementById(tabName);
  if (panel) panel.classList.add('active');
  renderAll();
}
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.onclick = () => goToTab(btn.dataset.tab);
});

// ===== Matérias =====
function addSubject() {
  const name = document.getElementById('subj-name').value.trim();
  const pass = parseFloat(document.getElementById('subj-pass').value);
  const max = parseFloat(document.getElementById('subj-max').value) || 10;
  const stages = parseInt(document.getElementById('subj-stages').value, 10);
  if (!name || isNaN(pass)) { alert('Preencha nome e nota mínima!'); return; }
  if (!stages || stages < 1) { alert('Diga quantas avaliações/etapas essa matéria terá!'); return; }
  data.subjects.push({ id:uid(), name, pass, max, stages });
  save();
  document.getElementById('subj-name').value='';
  document.getElementById('subj-pass').value='';
  document.getElementById('subj-max').value='';
  document.getElementById('subj-stages').value='';
  renderAll();
}

function deleteSubject(id) {
  if (!confirm('Excluir matéria e todos os dados relacionados?')) return;
  data.subjects = data.subjects.filter(s=>s.id!==id);
  data.studies = data.studies.filter(s=>s.subjectId!==id);
  data.grades = data.grades.filter(g=>g.subjectId!==id);
  data.events = data.events.filter(e=>e.subjectId!==id);
  save(); renderAll();
}

function statusHtml(status) {
  if (!status.text) return '';
  const icon = status.cssClass === 'aprovado' ? ICON_CHECK : (status.cssClass === 'reprovado' ? ICON_ALERT : '');
  return `<span class="status">${icon}${esc(status.text)}</span>`;
}

function renderSubjects() {
  const el = document.getElementById('subjects-list');
  if (!data.subjects.length) { el.innerHTML='<p class="empty">Nenhuma matéria cadastrada.</p>'; return; }
  el.innerHTML = data.subjects.map(s => {
    const status = getSubjectStatus(s.id);
    return `<div class="card ${status.cssClass}">
      <div class="card-header">
        <div>
          <strong>${esc(s.name)}</strong><br>
          <small>Nota mínima: ${esc(s.pass)} | Máxima: ${esc(s.max)}</small><br>
          ${statusHtml(status)}
        </div>
        <button class="btn btn-danger" data-id="${esc(s.id)}" onclick="deleteSubject(this.dataset.id)">Excluir</button>
      </div>
    </div>`;
  }).join('');
}

// ===== Estudos =====
function addStudy() {
  const subjectId = document.getElementById('study-subject').value;
  const date = document.getElementById('study-date').value;
  const hours = parseFloat(document.getElementById('study-hours').value);
  const topic = document.getElementById('study-topic').value.trim();
  if (!subjectId||!date||isNaN(hours)) { alert('Preencha matéria, data e horas!'); return; }
  data.studies.push({ id:uid(), subjectId, date, hours, topic });
  save();
  document.getElementById('study-hours').value='';
  document.getElementById('study-topic').value='';
  renderAll();
}

function deleteStudy(id) {
  data.studies = data.studies.filter(s=>s.id!==id); save(); renderAll();
}

function renderStudies() {
  const el = document.getElementById('studies-list');
  if (!data.studies.length) { el.innerHTML='<p class="empty">Nenhum estudo registrado.</p>'; return; }
  const sorted = [...data.studies].sort((a,b)=>b.date.localeCompare(a.date));

// ===== Notas =====
function addGrade() {
  const subjectId = document.getElementById('grade-subject').value;
  const name = document.getElementById('grade-name').value.trim();
  const value = parseFloat(document.getElementById('grade-value').value);
  const weight = parseFloat(document.getElementById('grade-weight').value)||1;
  if (!subjectId||!name||isNaN(value)) { alert('Preencha todos os campos!'); return; }
  data.grades.push({ id:uid(), subjectId, name, value, weight });
  save();
  document.getElementById('grade-name').value='';
  document.getElementById('grade-value').value='';
  renderAll();
}

function deleteGrade(id) {
  data.grades = data.grades.filter(g=>g.id!==id); save(); renderAll();
}

function getSubjectStatus(subjectId) {
  const subj = data.subjects.find(s=>s.id===subjectId);
  if (!subj) return { text:'', cssClass:'' };
  const grades = data.grades.filter(g=>g.subjectId===subjectId);
  // Matérias antigas (criadas antes de existir esse campo) não têm "stages"
  // definido — nesse caso mantém o comportamento anterior (veredito imediato).
  const stages = subj.stages || null;
  if (!grades.length) {
    const stageInfo = stages ? ` (0/${stages} avaliações lançadas)` : '';
    return { text:`Sem notas. Precisa de ${subj.pass} para passar.${stageInfo}`, cssClass:'', avg:0, needed:subj.pass };
  }
  const totalWeight = grades.reduce((a,g)=>a+g.weight,0);
  const sum = grades.reduce((a,g)=>a+g.value*g.weight,0);
  const avg = sum/totalWeight;

  if (stages && grades.length < stages) {
    return { text:`Média parcial: ${avg.toFixed(2)} (${grades.length}/${stages} avaliações lançadas — o veredito final só aparece depois de todas)`, cssClass:'', avg, needed:0 };
  }

  if (avg >= subj.pass) {
    return { text:`Aprovado! Média final: ${avg.toFixed(2)}`, cssClass:'aprovado', avg, needed:0 };
  }
  return { text:`Reprovado. Média final: ${avg.toFixed(2)}`, cssClass:'reprovado', avg, needed:0 };
}

function renderGrades() {
  const el = document.getElementById('grades-list');
  if (!data.subjects.length) { el.innerHTML='<p class="empty">Cadastre uma matéria primeiro.</p>'; return; }
  el.innerHTML = data.subjects.map(subj => {
    const grades = data.grades.filter(g=>g.subjectId===subj.id);
    const status = getSubjectStatus(subj.id);
    const progress = Math.min(100, (status.avg/subj.pass)*100);
    return `<div class="card ${status.cssClass}">
      <h3 style="margin-top:0">${esc(subj.name)}</h3>
      <p>${statusHtml(status)}</p>
      <div class="progress"><div class="progress-bar" style="width:${progress}%">${status.avg?status.avg.toFixed(2):'0'}</div></div>
      ${grades.length ? `<div class="table-wrap"><table>
        <tr><th>Avaliação</th><th>Nota</th><th>Peso</th><th></th></tr>
        ${grades.map(g=>`<tr>
          <td>${esc(g.name)}</td><td>${esc(g.value)}</td><td>${esc(g.weight)}</td>
          <td><button class="btn btn-danger btn-sm" aria-label="Excluir nota" data-id="${esc(g.id)}" onclick="deleteGrade(this.dataset.id)">Excluir</button></td>
        </tr>`).join('')}
      </table></div>` : '<small>Nenhuma nota lançada.</small>'}
    </div>`;
  }).join('');
}

// ===== Eventos / Calendário =====
// Se o usuário já conectou a Google Agenda no app principal (LifePlan), o
// token de acesso fica salvo no localStorage (mesma origem) e este arquivo
// pode reaproveitá-lo para também criar o evento lá, automaticamente.
async function syncEventToGoogleCalendar(ev) {
  try {
    const token = localStorage.getItem('gcal_token');
    if (!token) return; // Google Agenda não conectada — segue só localmente
    const body = {
      summary: `${ev.type === 'prova' ? 'Prova: ' : ''}${ev.title}`,
      description: ev.desc || '',
      start: { date: ev.date },
      end: { date: ev.date },
    };
    const res = await fetch('https://www.googleapis.com/calendar/v3/calendars/primary/events', {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (!res.ok) console.warn('Não foi possível sincronizar este evento com a Google Agenda.');
  } catch (e) {
    console.warn('Falha ao sincronizar com a Google Agenda:', e);
  }
}

function addEvent() {
  const title = document.getElementById('ev-title').value.trim();
  const type = document.getElementById('ev-type').value;
  const subjectId = document.getElementById('ev-subject').value;
  const date = document.getElementById('ev-date').value;
  const desc = document.getElementById('ev-desc').value.trim();
  if (!title||!date) { alert('Preencha título e data!'); return; }
  const newEvent = { id:uid(), title, type, subjectId, date, desc };
  data.events.push(newEvent);
  save();
  syncEventToGoogleCalendar(newEvent);
  document.getElementById('ev-title').value='';
  document.getElementById('ev-desc').value='';
  renderAll();
}

function deleteEvent(id) {
  data.events = data.events.filter(e=>e.id!==id); save(); renderAll();
}

function changeMonth(d) { currentDate.setMonth(currentDate.getMonth()+d); renderCalendar(); }

function renderCalendar() {
  const y = currentDate.getFullYear(), m = currentDate.getMonth();
  const months = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  document.getElementById('cal-title').textContent = `${months[m]} ${y}`;
  const firstDay = new Date(y,m,1).getDay();
  const daysInMonth = new Date(y,m+1,0).getDate();
  const today = new Date();
  let html = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'].map(d=>`<div class="day-name">${d}</div>`).join('');
  for (let i=0;i<firstDay;i++) html += '<div></div>';
  for (let d=1; d<=daysInMonth; d++) {
    const dateStr = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const events = data.events.filter(e=>e.date===dateStr);
    const isToday = today.getFullYear()===y&&today.getMonth()===m&&today.getDate()===d;
    html += `<div class="day ${events.length?'has-event':''} ${isToday?'today':''}" title="${esc(events.map(e=>e.title).join(', '))}">
      <span class="num">${d}</span>
      ${events.map(e=>`<div><span class="badge ${safeType(e.type)}">${esc(String(e.title).slice(0,15))}</span></div>`).join('')}
    </div>`;
  }
  document.getElementById('calendar').innerHTML = html;

  // lista
  const el = document.getElementById('events-list');
  if (!data.events.length) { el.innerHTML='<p class="empty">Nenhum evento.</p>'; return; }
  const sorted = [...data.events].sort((a,b)=>a.date.localeCompare(b.date));
  el.innerHTML = `<div class="table-wrap"><table>
    <tr><th>Data</th><th>Tipo</th><th>Título</th><th>Matéria</th><th>Descrição</th><th></th></tr>
    ${sorted.map(e=>{
      const subj = data.subjects.find(x=>x.id===e.subjectId);
      return `<tr>
        <td>${esc(formatDate(e.date))}</td>
        <td><span class="badge ${safeType(e.type)}">${esc(safeType(e.type))}</span></td>
        <td>${esc(e.title)}</td>
        <td>${subj?esc(subj.name):'-'}</td>
        <td>${esc(e.desc)||'-'}</td>
        <td><button class="btn btn-danger btn-sm" aria-label="Excluir evento" data-id="${esc(e.id)}" onclick="deleteEvent(this.dataset.id)">Excluir</button></td>
      </tr>`;
    }).join('')}
  </table></div>`;
}

// ===== Painel =====
function renderDashboard() {
  const totalHours = data.studies.reduce((a,s)=>a+s.hours,0);
  const weekHours = data.studies.filter(s=>{
    const d = new Date(s.date); const now=new Date();
    const diff = (now-d)/(1000*60*60*24);
    return diff>=0 && diff<=7;
  }).reduce((a,s)=>a+s.hours,0);
  const approved = data.subjects.filter(s=>getSubjectStatus(s.id).cssClass==='aprovado').length;

  document.getElementById('stats-grid').innerHTML = `
    <div class="stat"><h4>Matérias</h4><p>${data.subjects.length}</p></div>
    <div class="stat"><h4>Total de horas</h4><p>${totalHours.toFixed(1)}h</p></div>
    <div class="stat"><h4>Horas esta semana</h4><p>${weekHours.toFixed(1)}h</p></div>
    <div class="stat"><h4>Já aprovado em</h4><p>${approved}/${data.subjects.length}</p></div>
    <div class="stat"><h4>Avaliações</h4><p>${data.grades.length}</p></div>
    <div class="stat"><h4>Eventos futuros</h4><p>${data.events.filter(e=>e.date>=todayStr()).length}</p></div>
  `;

  // Horas por matéria
  const hbs = document.getElementById('hours-by-subject');
  if (!data.subjects.length) hbs.innerHTML='<p class="empty">Sem dados.</p>';
  else {
    const max = Math.max(...data.subjects.map(s=>data.studies.filter(st=>st.subjectId===s.id).reduce((a,b)=>a+b.hours,0)),1);
    hbs.innerHTML = data.subjects.map(s=>{
      const h = data.studies.filter(st=>st.subjectId===s.id).reduce((a,b)=>a+b.hours,0);
      return `<div style="margin:0.6rem 0"><strong>${esc(s.name)}</strong> <small>${h.toFixed(1)}h</small>
        <div class="progress"><div class="progress-bar" style="width:${(h/max)*100}%">${h.toFixed(1)}h</div></div></div>`;
    }).join('');
  }

  // Situação
  const sl = document.getElementById('situation-list');
  if (!data.subjects.length) sl.innerHTML='<p class="empty">Sem matérias.</p>';
  else sl.innerHTML = data.subjects.map(s=>{
    const st = getSubjectStatus(s.id);
    return `<div class="card ${st.cssClass}"><strong>${esc(s.name)}</strong><br>${statusHtml(st).replace('class="status"','class="status" style="font-weight:500"')}</div>`;
  }).join('');

  // Eventos próximos
  const ue = document.getElementById('upcoming-events');
  const upcoming = data.events.filter(e=>e.date>=todayStr()).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,5);
  if (!upcoming.length) ue.innerHTML='<p class="empty">Nenhum evento futuro.</p>';
  else ue.innerHTML = upcoming.map(e=>{
    const subj = data.subjects.find(x=>x.id===e.subjectId);
    return `<div class="card"><span class="badge ${safeType(e.type)}">${esc(safeType(e.type))}</span> <strong>${esc(e.title)}</strong> — ${esc(formatDate(e.date))} ${subj?'('+esc(subj.name)+')':''}</div>`;
  }).join('');
}

// ===== Helpers =====
function formatDate(s) { const [y,m,d]=String(s).split('-'); return `${d}/${m}/${y}`; }
function todayStr() { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }

// ── BUSCA ──────────────────────────────────────────────────────────────────
function openSearchPanel() {
  document.getElementById('search-overlay').style.display = 'flex';
  document.getElementById('search-input').value = '';
  document.getElementById('search-results').innerHTML = '<div class="empty">Digite algo pra buscar.</div>';
  setTimeout(() => document.getElementById('search-input').focus(), 50);
}
function closeSearchPanel() {
  document.getElementById('search-overlay').style.display = 'none';
}
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeSearchPanel();
});

function performSearch(query) {
  const q = query.trim().toLowerCase();
  const resultsEl = document.getElementById('search-results');
  if (!q) { resultsEl.innerHTML = '<div class="empty">Digite algo pra buscar.</div>'; return; }

  const results = [];

  data.subjects.forEach(s => {
    if (s.name.toLowerCase().includes(q)) {
      results.push({ title: s.name, subtitle: 'Matéria', value: '', onClick: () => { closeSearchPanel(); goToTab('materias'); } });
    }
  });

  data.grades.forEach(g => {
    const subj = data.subjects.find(s => s.id === g.subjectId);
    const haystack = `${g.name||''} ${subj?subj.name:''}`.toLowerCase();
    if (haystack.includes(q)) {
      results.push({ title: g.name, subtitle: `Nota · ${subj?subj.name:'—'}`, value: String(g.value), onClick: () => { closeSearchPanel(); goToTab('notas'); } });
    }
  });

  data.studies.forEach(e => {
    const subj = data.subjects.find(s => s.id === e.subjectId);
    const haystack = `${e.topic||''} ${subj?subj.name:''}`.toLowerCase();
    if (haystack.includes(q)) {
      results.push({ title: e.topic || '(sem tópico)', subtitle: `Estudo · ${subj?subj.name:'—'} · ${formatDate(e.date)}`, value: `${e.hours}h`, onClick: () => { closeSearchPanel(); goToTab('estudos'); } });
    }
  });

  data.events.forEach(e => {
    const subj = data.subjects.find(s => s.id === e.subjectId);
    const haystack = `${e.title||''} ${e.type||''} ${subj?subj.name:''}`.toLowerCase();
    if (haystack.includes(q)) {
      results.push({ title: e.title, subtitle: `Evento (${e.type||'—'}) · ${subj?subj.name:'—'}`, value: formatDate(e.date), onClick: () => { closeSearchPanel(); goToTab('calendario'); } });
    }
  });

  if (!results.length) {
    resultsEl.innerHTML = '<div class="empty">Nenhum resultado encontrado.</div>';
    return;
  }

  resultsEl.innerHTML = '';
  results.slice(0, 50).forEach(r => {
    const item = document.createElement('button');
    item.type = 'button';
    item.style.cssText = 'display:flex;align-items:center;gap:10px;padding:10px 16px;min-height:52px;width:100%;text-align:left;cursor:pointer;background:transparent;border:0;border-bottom:1px solid var(--border);border-radius:0;color:var(--text);font:inherit';
    item.onmouseenter = () => item.style.background = 'var(--surface2)';
    item.onmouseleave = () => item.style.background = 'transparent';
    item.innerHTML = `
      <div style="flex:1;min-width:0">
        <div style="font-size:14px;font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.title)}</div>
        <div style="font-size:12px;color:var(--muted)">${esc(r.subtitle)}</div>
      </div>
      <div style="font-size:13px;font-weight:700;color:var(--accent);white-space:nowrap;font-variant-numeric:tabular-nums">${esc(r.value)}</div>
    `;
    item.onclick = r.onClick;
    resultsEl.appendChild(item);
  });
}

// ── EXPORTAR RELATÓRIO EM PDF ──────────────────────────────────────────────
// Junta matérias, notas, histórico de estudos e próximos eventos num único
// documento, usando o "Imprimir > Salvar como PDF" do navegador.
function exportStudyReportPDF() {
  const today = new Date().toLocaleDateString('pt-BR');
  let html = `<h1>Relatório de Estudos</h1><div class="pdf-subtitle">Gerado em ${today} — LifePlan</div>`;

  // ── MATÉRIAS ──
  html += `<h2>Matérias</h2>`;
  if (!data.subjects.length) {
    html += `<div class="pdf-empty">Nenhuma matéria cadastrada.</div>`;
  } else {
    html += `<table><thead><tr><th>Matéria</th><th>Nota mínima</th><th>Nota máxima</th><th>Etapas</th><th>Situação</th></tr></thead><tbody>`;
    data.subjects.forEach(s => {
      const st = getSubjectStatus(s.id);
      const cls = st.cssClass === 'aprovado' ? 'pdf-ok' : (st.cssClass === 'reprovado' ? 'pdf-bad' : '');
      html += `<tr><td>${esc(s.name)}</td><td>${esc(s.pass)}</td><td>${esc(s.max)}</td><td>${esc(s.stages||'—')}</td><td class="${cls}">${esc(st.text)}</td></tr>`;
    });
    html += `</tbody></table>`;
  }

  // ── NOTAS POR MATÉRIA ──
  html += `<h2>Notas</h2>`;
  if (!data.grades.length) {
    html += `<div class="pdf-empty">Nenhuma nota lançada.</div>`;
  } else {
    data.subjects.forEach(s => {
      const grades = data.grades.filter(g => g.subjectId === s.id);
      if (!grades.length) return;
      html += `<h3>${esc(s.name)}</h3>`;
      html += `<table><thead><tr><th>Avaliação</th><th>Nota</th><th>Peso</th></tr></thead><tbody>`;
      grades.forEach(g => {
        html += `<tr><td>${esc(g.name)}</td><td>${esc(g.value)}</td><td>${esc(g.weight)}</td></tr>`;
      });
      html += `</tbody></table>`;
    });
  }

  // ── HISTÓRICO DE ESTUDOS ──
  html += `<h2>Histórico de estudos</h2>`;
  if (!data.studies.length) {
    html += `<div class="pdf-empty">Nenhuma sessão de estudo registrada.</div>`;
  } else {
    const totalHoras = data.studies.reduce((s,e) => s + (parseFloat(e.hours)||0), 0);
    html += `<table><thead><tr><th>Data</th><th>Matéria</th><th>Horas</th><th>Tópico</th></tr></thead><tbody>`;
    [...data.studies].sort((a,b) => b.date.localeCompare(a.date)).forEach(e => {
      const subj = data.subjects.find(s => s.id === e.subjectId);
      html += `<tr><td>${esc(formatDate(e.date))}</td><td>${subj?esc(subj.name):'—'}</td><td>${esc(e.hours)}h</td><td>${esc(e.topic)||'—'}</td></tr>`;
    });
    html += `<tr><td colspan="2"><b>Total</b></td><td colspan="2"><b>${totalHoras}h</b></td></tr>`;
    html += `</tbody></table>`;
  }

  // ── PRÓXIMOS EVENTOS ──
  html += `<h2>Próximos eventos</h2>`;
  const upcoming = data.events.filter(e => e.date >= todayStr()).sort((a,b) => a.date.localeCompare(b.date));
  if (!upcoming.length) {
    html += `<div class="pdf-empty">Nenhum evento futuro cadastrado.</div>`;
  } else {
    html += `<table><thead><tr><th>Data</th><th>Tipo</th><th>Título</th><th>Matéria</th></tr></thead><tbody>`;
    upcoming.forEach(e => {
      const subj = data.subjects.find(s => s.id === e.subjectId);
      html += `<tr><td>${esc(formatDate(e.date))}</td><td>${esc(e.type||'—')}</td><td>${esc(e.title)}</td><td>${subj?esc(subj.name):'—'}</td></tr>`;
    });
    html += `</tbody></table>`;
  }

  document.getElementById('pdf-report').innerHTML = html;
  window.print();
}

function fillSubjectSelects() {
  const opts = data.subjects.map(s=>`<option value="${esc(s.id)}">${esc(s.name)}</option>`).join('');
  ['study-subject','grade-subject','ev-subject'].forEach(id=>{
    const el = document.getElementById(id);
    const placeholder = id==='ev-subject' ? '<option value="">-- Sem matéria --</option>' : '<option value="">-- Selecione --</option>';
    const prev = el.value;
    el.innerHTML = placeholder + opts;
    if (prev) el.value = prev;
  });
}

function renderAll() {
  fillSubjectSelects();
  renderSubjects();
  renderStudies();
  renderGrades();
  renderCalendar();
  renderDashboard();
  renderGoogleEvents();
}

// Puxa os eventos da Google Agenda (mesmo token salvo pelo app principal) e
// mostra aqui, completando a sincronização nos dois sentidos: os eventos
// criados aqui já vão para o Google (syncEventToGoogleCalendar), e os
// eventos do Google aparecem aqui.
async function renderGoogleEvents() {
  const el = document.getElementById('google-events-list');
  if (!el) return;
  const token = localStorage.getItem('gcal_token');
  if (!token) { el.innerHTML = '<p class="empty">Conecte a Google Agenda na tela Início do LifePlan para ver seus eventos aqui.</p>'; return; }
  try {
    const now = new Date();
    const start = new Date(now.getFullYear(), now.getMonth(), now.getDate()).toISOString();
    const end = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 60).toISOString();
    const url = `https://www.googleapis.com/calendar/v3/calendars/primary/events?timeMin=${start}&timeMax=${end}&singleEvents=true&orderBy=startTime&maxResults=20`;
    const res = await fetch(url, { headers: { Authorization: `Bearer ${token}` } });
    if (!res.ok) { el.innerHTML = '<p class="empty">Não foi possível carregar os eventos do Google agora.</p>'; return; }
    const json = await res.json();
    const items = json.items || [];
    if (!items.length) { el.innerHTML = '<p class="empty">Nenhum evento futuro na sua Google Agenda.</p>'; return; }
    el.innerHTML = `<div class="table-wrap"><table>
      <tr><th>Data</th><th>Título</th></tr>
      ${items.map(e => {
        const startStr = e.start?.dateTime || e.start?.date;
        const d = startStr ? new Date(startStr) : null;
        const dateLabel = d ? d.toLocaleDateString('pt-BR') + (e.start?.dateTime ? ' ' + d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}) : '') : '-';
        return `<tr><td>${esc(dateLabel)}</td><td>${esc(e.summary||'(sem título)')}</td></tr>`;
      }).join('')}
    </table></div>`;
  } catch (e) {
    console.error(e);
    el.innerHTML = '<p class="empty">Não foi possível carregar os eventos do Google agora.</p>';
  }
}

document.getElementById('study-date').value = todayStr();
document.getElementById('ev-date').value = todayStr();
renderAll();
